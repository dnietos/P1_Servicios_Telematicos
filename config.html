<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <title>Configuración - Smart Room</title>
        <link rel="stylesheet" href="css/iroom.css">
    </head>

    <body>

        <main>

            <header>
                <h1>Configuración de Smart Room</h1>
            </header>

            <nav>
                <a href="index.html">Inicio</a>
             <a href="config.html">Configuración</a>
             <a href="minombre.html">Nombre</a>
            </nav>

            <form action ="datos.js" method="post"> <!-- action significa a dónde se envían los datos del     formulario, method significa el método de envío -->

                <div class="contenedor-formulario">

                    <section class="columna-formulario">

                        <h2>Información de la Habitación</h2>

                        <label for="pais">País:</label> 
                        <input type="text" id="pais" name="pais" list="lista-paises"> <!-- el id identifica el elemento dentro de la pag y el name identifica el dato en el formulario-->

                            <datalist id="lista-paises">
                                <option value="España">
                             <option value="Francia">
                                <option value="Alemania">
                             <option value="Italia">                            
                                <option value="Portugal">
                                <option value="Reino Unido">
                            </datalist>

                       <label for="ciudad">Ciudad:</label>
                        <input type="text" id="ciudad" name="ciudad">

                     <label for="localizacion">Localización:</label>
                        <input type="text" id="localizacion" name="localizacion">

                     <label for="mapa">Enlace de Google Maps:</label>
                        <input type="url" id="mapa" name="mapa"> <!-- el tipo url permite que el navegador valide que lo introducido es una url -->
                                
                     <label for="foto">Foto de la habitación:</label>
                        <input type="file" id="foto" name="foto">

                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password">

                    </section> <!-- se acaba columna-formulario -->

                    <section class="columna-formulario">

                        <h2>Sensores</h2>

                          <input type="checkbox" id="temperatura" name="sensores" value="temperatura">

                         <label for="temperatura">Temperatura</label><!--el checkbox permite seleccionar o deseleccionar una casilla-->

                        
                          <input type="checkbox" id="humedad" name="sensores" value="humedad">
                         <label for="humedad">Humedad</label>

                         <input type="checkbox" id="luz" name="sensores" value="luz">
                         <label for="luz">Luz </label>

                          <input type="checkbox" id="movimiento" name="sensores" value="movimiento">
                         <label for="movimiento">Movimiento </label>
                        
                         <label for="temp-min">Temperatura mínima: </label>
                         <input type="number" id="temp-min" name="temp-min" min="-20" max="45" step="0.1">
                        
                         <label for="temp-max">Temperatura máxima:</label>
                         <input type="number" id="temp-max" name="temp-max" min="-20" max="45" step="0.1">
                        
                          <label for="diferencia">Diferencia de temperatura:</label>
                          <output id="diferencia" name="diferencia">0</output>

                    </section>   

                </div> <!-- se acaba contenedor-formulario -->


                <button type="submit">Guardar Configuración</button>
            

            </form>

            <a id="enlace-vuelta"
            href="index.html">Volver a la página principal</a>


        </main>

        <script>

            const tempMin = document.getElementById("temp-min");
            // crear constante, nombre que elegimos,guardar, nuestra página HTML, buscar por ID, qué elemento buscamos//
            const tempMax = document.getElementById("temp-max");
            // Busca en el HTML el elemento cuyo id es "temp-max" y guárdame una referencia a él con el nombre tempMax.//
            const diferencia = document.getElementById("diferencia");

            tempMin.addEventListener("input", calcularDiferencia); //Cuando el usuario cambie la temperatura mínima ejecuta calcularDiferencia.//
            tempMax.addEventListener("input", calcularDiferencia); 
            //En el campo de temperatura mínima, estate atento a que ocurra algo

            function calcularDiferencia() {

                const min = Number(tempMin.value);
                const max = Number(tempMax.value);

                if (tempMin.value === "" || tempMax.value === "") {

                    diferencia.value = "";
                    tempMax.setCustomValidity("");
                    return;
                }



                if (max < min) {
                 tempMax.setCustomValidity("La temperatura máxima no puede ser menor que la mínima."); //setCustomValidity permite establecer un mensaje de error personalizado de validación para ese campo.
                 //Marca tempMax como no válido y utiliza este mensaje para explicar el problema
                 diferencia.value = "Error"; //Si la temperatura máxima es menor que la mínima, se borra el valor de la diferencia y el campo se considera inválido.
                } else {
                    tempMax.setCustomValidity(""); //Si la temperatura máxima es mayor o igual a la mínima, se borra el mensaje de error y el campo se considera válido.
                    diferencia.value = max - min;
                }
            }

        </script>
        



    </body>
</html>
